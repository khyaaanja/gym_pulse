<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .anim-layer {
        will-change: transform, opacity;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- Root composition element for floating shapes -->
    <div data-hf-id="hf-floating-shapes-root" id="floating-shapes-root" class="clip" data-composition-id="floating-shapes" data-start="0" data-duration="7" data-width="1920" data-height="1080" data-layout-allow-overflow="true">
      <!-- Floating geometric pattern - triangles -->
      <div data-hf-id="hf-awkp" class="anim-layer clip shapes-group" id="floating-shapes" style="
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%) rotate(15deg);
          opacity: 0;
        " data-start="0" data-duration="7">
        <div data-hf-id="hf-5cs7" id="shape-triangle-1" class="clip shape-triangle" style="
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(246, 173, 85, 0.12);
            border: 2px solid #f6ad55;
            transform: rotate(45deg);
            margin: 15px;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-gmq5" id="shape-triangle-2" class="clip shape-triangle" style="
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(221, 107, 74, 0.1);
            border: 2px solid #dd6b4a;
            transform: rotate(45deg);
            margin: 25px;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-q7na" id="shape-triangle-3" class="clip shape-triangle" style="
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(246, 173, 85, 0.15);
            border: 2px solid #f6ad55;
            transform: rotate(45deg);
            margin: 12px;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["floating-shapes"] = tl;

      tl.set(".shapes-group, .shape-triangle", { opacity: 1 }, 0);
      tl.to(".shapes-group", { rotate: "+=45deg", duration: 0.8, ease: "linear" }, 1.5);
      tl.seek(0);
    </script>
  </body>
</html>
