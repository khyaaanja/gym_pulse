<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: 'Inter', 'ui-sans-serif', 'system-ui', sans-serif;
      }
      /* --- Performance: use will-change only on animating elements --- */
      .anim-layer {
        will-change: transform, opacity;
        opacity: 0;
      }
      /* Background layers: start hidden (lint compliance); revealed by GSAP timeline at t=0 */
      .bg-gradient,
      .shape-circle,
      .shapes-group,
      .accent-ring {
        opacity: 0;
      }
      /* Particles start hidden; revealed by GSAP timeline */
      .particles [data-hf-id] {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- Root composition element -->
    <div data-hf-id="hf-rcmb" id="motion-animation-root" class="clip" data-composition-id="motion-animation" data-start="0" data-duration="7" data-width="1920" data-height="1080" data-layout-allow-overflow="true">
      <!-- Background gradient container -->
      <div data-hf-id="hf-rvwo" class="anim-layer clip bg-gradient" id="background-gradient" style="
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 35%, #0f3460 65%, #0a0a0a 100%);
          opacity: 0;
        " data-start="0" data-duration="7"></div>

      <!-- Primary moving shape - gold circle -->
      <div data-hf-id="hf-i08m" class="anim-layer clip shape-circle" id="hero-circle" style="
          position: absolute;
          width: 350px;
          height: 350px;
          border-radius: 50%;
          background: linear-gradient(135deg, #f6ad55, #dd6b4a);
          top: 15%;
          left: -8%;
          box-shadow: 0 0 80px rgba(246, 173, 85, 0.35), 0 15px 30px rgba(221, 107, 74, 0.25);
          opacity: 0;
        " data-start="0" data-duration="7"></div>

      <!-- Floating geometric pattern - triangles (sub-composition) -->
      <div data-hf-id="hf-awkp" class="clip" id="floating-shapes" data-composition-src="compositions/floating-shapes.html" data-composition-id="floating-shapes" data-start="0" data-duration="7"></div>

      <!-- Main title with entrance animation -->
      <h1 data-hf-id="hf-4o2g" id="title" class="clip" data-start="0" data-duration="7" data-track-index="0" style="
          color: #f4f4f5;
          font-size: 110px;
          font-weight: 600;
          letter-spacing: -0.02em;
          line-height: 1.05;
          white-space: nowrap;
        ">
        MOTION ANIMATION
      </h1>

      <!-- Subtitle with typed effect -->
      <p data-hf-id="hf-og2t" id="subtitle" class="clip" data-start="0.3" data-duration="6.7" data-track-index="0" data-layout-allow-overlap="true" style="
          color: #a0a0a0;
          font-size: 32px;
          font-weight: 400;
          letter-spacing: 0.03em;
          margin-top: 30px;
          opacity: 0;
        ">
        Super attractive • Ultra fast • All devices
      </p>

      <!-- Performance stats / label -->
      <p data-hf-id="hf-gu6c" id="label" class="clip" data-start="3" data-duration="4" data-track-index="0" style="
          position: absolute;
          bottom: 50px;
          left: 50px;
          color: rgb(170,170,170);
          font-size: 16px;
          font-weight: 400;
          letter-spacing: 0.08em;
          text-transform: uppercase;
        ">
        Optimized for performance
      </p>

      <!-- Accent ring -->
      <div data-hf-id="hf-cejg" class="anim-layer clip accent-ring" id="accent-ring" style="
          position: absolute;
          width: 650px;
          height: 650px;
          border: 1px solid rgba(246, 173, 85, 0.15);
          border-radius: 50%;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          opacity: 0;
        " data-start="0" data-duration="7"></div>

      <!-- Particle-like dots background -->
      <div data-hf-id="hf-33n7" class="anim-layer clip particles" id="particle-background" style="
          position: absolute;
          inset: 0;
          pointer-events: none;
        ">
        <div data-hf-id="hf-z83s" id="particle-1" class="clip" style="
            position: absolute;
            width: 7px;
            height: 7px;
            background: #f6ad55;
            border-radius: 50%;
            left: 25%;
            top: 35%;
            box-shadow: 0 0 15px #f6ad55;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-f7qn" id="particle-2" class="clip" style="
            position: absolute;
            width: 5px;
            height: 5px;
            background: #dd6b4a;
            border-radius: 50%;
            left: 75%;
            top: 65%;
            box-shadow: 0 0 12px #dd6b4a;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-u0zx" id="particle-3" class="clip" style="
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4a90e2;
            border-radius: 50%;
            left: 20%;
            top: 80%;
            box-shadow: 0 0 10px #4a90e2;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-bgn4" id="particle-4" class="clip" style="
            position: absolute;
            width: 6px;
            height: 6px;
            background: #6c5ce7;
            border-radius: 50%;
            left: 70%;
            top: 30%;
            box-shadow: 0 0 14px #6c5ce7;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
        <div data-hf-id="hf-hc8x" id="particle-5" class="clip" style="
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00e676;
            border-radius: 50%;
            left: 92%;
            top: 45%;
            box-shadow: 0 0 18px #00e676;
            opacity: 0;
          " data-start="0" data-duration="7"></div>
      </div>
    </div>

    <script>
      // --- Register the one paused root timeline ---
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["motion-animation"] = tl;

      // --- Make background layers visible at t=0 (in timeline for lint compliance) ---
      // These have CSS animations running from start; GSAP sets initial state in timeline.
      tl.set(".bg-gradient, .shape-circle, .accent-ring, .particles [data-hf-id]", { opacity: 1 }, 0);

      /* ==========================================
       GSAP ANIMATION SEQUENCE - ULTRA-FAST & CLEAN
       ==========================================
       All animations are performance-optimized:
       - Only transform and opacity properties (hardware-accelerated)
       - will-change set in CSS for browser optimization
       - No layout thrashing - all values pre-calculated
       - Easing curves optimized for all devices (cubic-out for pops, back-out for bounce)
       - Ultra-fast pacing throughout
       ========================================== */

      /* --- Title entrance: fast scale + color pop at composition start (t=0) --- */
      tl.fromTo(
        "#title",
        { opacity: 0, scale: 0.7, y: -50 },
        { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "cubic-out" },
        0
      );

      /* --- Subtitle fade + slide up at 0.3s (faster entrance) --- */
      tl.fromTo(
        "#subtitle",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.5, ease: "cubic-out" },
        0.3
      );

      /* --- Accent ring pulse emphasis at 0.8s (faster emphasis) --- */
      tl.to(
        "#accent-ring",
        { opacity: 0.5, duration: 0.3, ease: "power2-inOut" },
        0.8
      );

      /* --- Shape circle float acceleration at 1s --- */
      tl.to(
        ".shape-circle",
        { yPercent: -12, ease: "power2-inOut" },
        1
      );

      /* --- Particle pulse sequence at 2s, 2.1s, 2.2s, 2.3s, 2.4s (ultra-fast) --- */
      tl.to(
        "#particle-1",
        { opacity: 1, duration: 0.2, ease: "power2-inOut" },
        2
      );
      tl.to(
        "#particle-2",
        { opacity: 1, duration: 0.2, ease: "power2-inOut" },
        2.1
      );
      tl.to(
        "#particle-3",
        { opacity: 1, duration: 0.2, ease: "power2-inOut" },
        2.2
      );
      tl.to(
        "#particle-4",
        { opacity: 1, duration: 0.2, ease: "power2-inOut" },
        2.3
      );
      tl.to(
        "#particle-5",
        { opacity: 1, duration: 0.2, ease: "power2-inOut" },
        2.4
      );

      /* --- Label slide in at 3s --- */
      tl.fromTo(
        "#label",
        { opacity: 0, x: -30 },
        { opacity: 1, x: 0, duration: 0.4, ease: "cubic-out" },
        3
      );

      /* --- Grand pulse on all layers at 4s (quick climax) --- */
      tl.to(
        ".anim-layer",
        { opacity: 0.9, duration: 0.8, ease: "power2-inOut" },
        4
      );

      /* --- Scale bounce hold on title at 5s --- */
      tl.to(
        "#title",
        { scale: 1.03, duration: 0.3, ease: "back-out(1.5)" },
        5
      );

      /* --- Fade out everything at end (6s) - quick close --- */
      tl.to(
        "#title, #subtitle, #label, .anim-layer",
        { opacity: 0, duration: 1, ease: "power1-in" },
        6
      );

      /* --- Register timeline with runtime --- */
      tl.seek(0);

      // --- Auto-play for HyperFrames preview (best effort) ---
      // In preview mode, the runtime may not auto-play. This attempts to play after init.
      // During render, the runtime controls the timeline via seek(), so this won't interfere.
      if (window.__hfPreviewErrors !== void 0) {
        gsap.delayedCall(0, () => {
          if (tl.paused() && tl.time() === 0) tl.play();
        });
      }
    </script>
  </body>
</html>
