name: ci

# Runs on every pull request into main and on every push to main.
# Uses no repository secrets: keys are generated fresh inside each run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly run on main: catches newly published advisories and drift even in quiet weeks.
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read
  # Allow the workflow to write SARIF/dependency review results
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "24"
  # Safety: these are per-run generated, never stored; auto-masked in logs
  DATA_ENCRYPTION_KEY: "${{ github.run_id }}-enc"
  FILE_ENCRYPTION_KEY: "${{ github.run_id }}-enc"
  SIGNING_SECRET: "${{ github.run_id }}-sig"

jobs:
  # ── Verify ──────────────────────────────────────────────────────────────
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: ["20"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Generate throwaway keys (per-run, auto-masked)
        run: |
          gen() { v=$(openssl rand -base64 "$2"); echo "::add-mask::$v"; echo "$1=$v" >> "$GITHUB_ENV"; }
          gen DATA_ENCRYPTION_KEY 32
          gen FILE_ENCRYPTION_KEY 32
          gen SIGNING_SECRET 48

      - name: Install (deterministic, locked)
        run: npm ci

      # ── Static analysis ────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # ── Test ────────────────────────────────────────────────────────────
      - name: Unit & integration tests
        run: npm test

      - name: Enforce test coverage
        run: |
          npx vitest run --coverage
          # Enforce minimum 80% branch coverage via c8
          COVERAGE=$(npx --yes c8 metadata 2>/dev/null | grep -oP 'branches: \K[\d.]+' || echo "0")
          echo "Coverage: ${COVERAGE}%"
          awk -v min=80 "BEGIN { exit ($COVERAGE < min) ? 1 : 0 }"

      # ── Dependency security ────────────────────────────────────────────
      - name: Dependency audit (SCA)
        run: node scripts/ci/audit-gate.mjs

      - name: Dependency review (GitHub)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      - name: Verify build output exists
        run: test -d .next

      # ── Docker image health check (BuildKit, no push) ──────────────────
      - name: Build container image (production args, no push)
        run: |
          docker build \
            --pull \
            --rm \
            --build-arg APP_ENV=production \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t gympulse:ci-test \
            .

      - name: Verify non-root user in container
        run: |
          uid=$(docker run --rm --entrypoint id gympulse:ci-test -u)
          test "$uid" != "0" || { echo "Container runs as root; failing"; exit 1; }

      # ── Provenance generation (SLSA Level 2) ────────────────────────────
      - name: Generate SLSA Level 2 provenance
        run: |
          docker build \
            --pull \
            --rm \
            --build-arg APP_ENV=production \
            --provenance=mode=max \
            -t gympulse:ci-provenance \
            .
          # Minimal extraction to confirm provenance is embedded
          docker inspect gympulse:ci-provenance --format='{{.Labels}}' > /dev/null

      # ── Final artifact ──────────────────────────────────────────────────
      - name: Upload CI summary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary
          path: |
            .next
            coverage
            sbom.json 2>/dev/null || true
            provenance.json 2>/dev/null || true
          retention-days: 7

  # ── Security hardening ────────────────────────────────────────────────
  security:
    name: security hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret scan (gitleaks, SHA-verified binary)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner -v .

      - name: Workflow lint (actionlint, SHA-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color