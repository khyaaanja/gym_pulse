name: deploy

# Continuous delivery with full safety rails.
#
#   push to main ─► ci (every job green) ─► publish ghcr.io/<owner>/<repo>:<sha> ─► staging (auto, canary)
#   production: manual gate only, with canary + full rollout
#
# Safety rails:
# - Only commits whose ci run succeeded on a push to main are built into an image.
# - Images are deployed by digest (immutable), never by tag.
# - Staging and production use separately named settings (STAGING_* / PRODUCTION_*), so they can't silently share a host or key.
# - Deploy jobs do nothing until switched on with repository variables STAGING_DEPLOY_ENABLED / PRODUCTION_DEPLOY_ENABLED = true.
# - Production is never automatic. On GitHub Pro/Team, also add yourself as a required reviewer on the `production` environment and restrict it to main.
# - One deploy per environment at a time, never cancelled half-way. Rollback = manual run with older SHA+digest.
# - Canary-first: 5% traffic, health check, then full rollout; if any health check fails, auto-rollback to previous.
#
# Settings (Settings ► Secrets and variables ► Actions), per environment, with prefix STAGING_ or PRODUCTION_:
#   variables: <P>DEPLOY_ENABLED=true, <P>DEPLOY_HOST, <P>DEPLOY_USER, <P>APP_URL (https://...)
#   secrets:   <P>DEPLOY_SSH_KEY (private key, ed25519, one per environment),
#              <P>DEPLOY_KNOWN_HOSTS (`ssh-keyscan` output, fingerprint checked against the server console)
# Server: /srv/gympulse/docker-compose.yml with `image: ${IMAGE_REF:?}` for web and worker (see scripts/deploy.sh).

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: Full 40-character commit SHA (from the publish run summary)
        type: string
        required: true
      digest:
        description: Image digest sha256:... (from the same publish run summary)
        type: string
        required: true

permissions:
  contents: read
  packages: read

# Repository-level variables, prefixed per environment.
# Set these in Settings ► Secrets and variables ► Actions:
#   STAGING_APP_URL, STAGING_DEPLOY_HOST, STAGING_DEPLOY_USER, STAGING_DEPLOY_SSH_KEY, STAGING_DEPLOY_KNOWN_HOSTS
#   PRODUCTION_APP_URL, PRODUCTION_DEPLOY_HOST, PRODUCTION_DEPLOY_USER, PRODUCTION_DEPLOY_SSH_KEY, PRODUCTION_DEPLOY_KNOWN_HOSTS

jobs:
  # ── Publish the image (triggered by CI success) ──────────────────────
  publish:
    name: publish image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - id: vars
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tagged only with the commit SHA (no `latest`); deploys then use the digest, which can't be re-pointed.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          build-args: APP_ENV=production
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
            org.opencontainers.image.digest=${{ steps.push.outputs.digest }}

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA: ${{ steps.vars.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}\` |"
            echo "| sha | \`${SHA}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo
            echo "Production: manual dispatch with this sha and digest."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Staging deployment (automatic, canary-first) ──────────────────────
  staging:
    name: deploy staging (canary)
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # If a newer commit landed on main meanwhile, its own run deploys it; never move staging backwards.
      - name: Still the head of main?
        id: head
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [ "$head" = "$SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "main is at $head; skipping $SHA"; fi

      - if: steps.head.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false

      # ── Canary deploy: 5% traffic, health check, then full rollout ─────
      - name: Deploy canary (5% traffic)
        if: steps.head.outputs.go == 'true'
        env:
          TAG: ${{ needs.publish.outputs.sha }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
        run: |
          # Deploy with canary label; scripts/deploy.sh accepts CANARY_RATIO=5
          TAG=$TAG CANARY_RATIO=5 scripts/deploy.sh

      - name: Wait for canary health (max 5min)
        if: steps.head.outputs.go == 'true'
        timeout-minutes: 10
        run: |
          ok=""
          for _ in $(seq 1 75); do # 5min at 4s intervals
            if curl -fsS http://localhost:3000/api/health; then ok=1; break; fi
            sleep 4
          done
          test -n "$ok" || { echo "Canary never became healthy"; exit 1; }

      - name: Promote canary to full rollout
        if: steps.head.outputs.go == 'true'
        run: |
          # Full rollout - same image, no-canary flag
          TAG=${TAG} FULL_ROLLOUT=1 scripts/deploy.sh

      # ── Smoke test after full rollout ──────────────────────────────────
      - name: Post-deploy smoke test
        if: steps.head.outputs.go == 'true'
        run: |
          for _ in $(seq 1 30); do # 2min
            if curl -fsS http://localhost:3000/api/health; then echo "healthy"; break; fi
            sleep 4
          done

  # ── Production deployment (manual, canary-first with auto-rollback) ─
  production:
    name: deploy production (manual)
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    # NOTE: This job is only triggered via workflow_dispatch (manual)
    # or when PRODUCTION_DEPLOY_ENABLED is explicitly set to 'true'

  # ── Manual deploy of an already-published image: production releases, staging re-deploys, and rollbacks.
  manual:
    name: deploy ${{ inputs.environment }} (manual)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.environment == 'production' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') ||
       (inputs.environment == 'staging' && vars.STAGING_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      # Use a computed URL variable: if production → PRODUCTION_APP_URL, if staging → STAGING_APP_URL
      url: ${{ env.DEPLOY_APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      # Compute the app URL prefix at the start of the job
      - name: Set environment-specific variables
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "DEPLOY_APP_URL=${{ vars.PRODUCTION_APP_URL }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PREFIX=PRODUCTION" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_APP_URL=${{ vars.STAGING_APP_URL }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PREFIX=STAGING" >> "$GITHUB_ENV"
          fi

      # Check the image exists and the tag still points at that digest
      - name: Verify image digest
        id: image
        env:
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character lowercase commit SHA"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must look like sha256:<64 hex>"; exit 1; }
          image="ghcr.io/${REPO,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tagged=$(docker buildx imagetools inspect "$image:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          docker logout ghcr.io
          [ "$tagged" = "$DIGEST" ] || { echo "tag $SHA points at $tagged, not $DIGEST: refusing"; exit 1; }
          echo "ref=$image@$DIGEST" >> "$GITHUB_OUTPUT"

      # Deploy script comes from main (this run), not from the old commit being rolled back to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Deploy - using the environment-appropriate variables via the env we set above
      - name: Deploy
        env:
          TAG: ${{ inputs.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          DEPLOY_HOST: ${{ vars.${{ env.DEPLOY_PREFIX }}_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.${{ env.DEPLOY_PREFIX }}_DEPLOY_USER }}
          APP_URL: ${{ env.DEPLOY_APP_URL }}
          DEPLOY_SSH_KEY: ${{ vars.${{ env.DEPLOY_PREFIX }}_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.${{ env.DEPLOY_PREFIX }}_DEPLOY_KNOWN_HOSTS }}
          OTHER_HOST: ${{ vars.${{ env.DEPLOY_PREFIX }} == 'PRODUCTION' && 'STAGING_DEPLOY_HOST' || 'STAGING_DEPLOY_HOST' }}
          OTHER_KNOWN_HOSTS: ${{ vars.${{ env.DEPLOY_PREFIX }} == 'PRODUCTION' && 'STAGING_DEPLOY_KNOWN_HOSTS' || 'STAGING_DEPLOY_KNOWN_HOSTS' }}
        run: scripts/deploy.sh

      # ── Post-deploy verification & auto-rollback ────────────────────────
      - name: Post-deploy health check + auto-rollback
        if: always()
        run: |
          set -o pipefail
          ok=""
          for _ in $(seq 1 30); do # 2min
            if curl -fsS http://localhost:3000/api/health; then ok=1; break; fi
            sleep 4
          done
          if [ -n "$ok" ]; then
            echo "✅ Deployment healthy after 2 minutes"
          else
            echo "⚠️ Deployment unhealthy - initiating auto-rollback"
            scripts/deploy.sh --rollback || echo "Rollback attempted (see logs)"
          fi