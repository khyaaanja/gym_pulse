name: deploy

# Continuous delivery.
#
#   push to main ─► ci (every job green) ─► publish ghcr.io/<owner>/<repo>:<commit sha> ─► staging (automatic)
#   production: only by hand (Actions ► deploy ► Run workflow) with the SHA and digest printed by a publish run.
#
# Safety rails:
# - Only commits whose ci run succeeded on a push to main are built into an image. The workflow definition that runs
#   on workflow_run is always main's, so a pull request cannot change what deploys.
# - Images are deployed by digest (immutable), never by tag. The server also checks the running container's revision
#   label against the commit SHA.
# - Staging and production use separately named settings (STAGING_* / PRODUCTION_*), so they can't silently share a
#   host or key even on plans without GitHub Environments. scripts/deploy.sh refuses if the two hosts are the same.
# - Deploy jobs do nothing until switched on with repository variables STAGING_DEPLOY_ENABLED /
#   PRODUCTION_DEPLOY_ENABLED = true.
# - Production is never automatic. On GitHub Pro/Team, also add yourself as a required reviewer on the `production`
#   environment and restrict it to main.
# - One deploy per environment at a time, never cancelled half-way. Rollback = a manual run with an older SHA+digest.
#
# Settings (Settings ► Secrets and variables ► Actions), per environment, with prefix STAGING_ or PRODUCTION_:
#   variables: <P>DEPLOY_ENABLED=true, <P>DEPLOY_HOST, <P>DEPLOY_USER, <P>APP_URL (https://...)
#   secrets:   <P>DEPLOY_SSH_KEY (private key, ed25519, one per environment),
#              <P>DEPLOY_KNOWN_HOSTS (`ssh-keyscan` output, fingerprint checked against the server console)
# Server: /srv/gympulse/docker-compose.yml with `image: ${IMAGE_REF:?}` for web and worker (see scripts/deploy.sh).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        required: true
      sha:
        description: Full 40-character commit SHA (from the publish run summary)
        type: string
        required: true
      digest:
        description: Image digest sha256:... (from the same publish run summary)
        type: string
        required: true

permissions: {}

jobs:
  publish:
    name: publish image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      image: ${{ steps.vars.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - id: vars
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit pinned by digest too; the action's default image is a moving tag.
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged only with the commit SHA (no `latest`); deploys then use the digest, which can't be re-pointed.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          build-args: APP_ENV=production
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          SHA: ${{ steps.vars.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${IMAGE}\` |"
            echo "| sha | \`${SHA}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo
            echo "Production: Actions ► deploy ► Run workflow with this sha and digest."
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: deploy staging
    needs: publish
    if: needs.publish.result == 'success' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # If a newer commit landed on main meanwhile, its own run deploys it; never move staging backwards.
      - name: Still the head of main?
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          head=$(gh api "repos/$REPO/commits/main" -q .sha)
          if [ "$head" = "$SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "main is at $head; skipping $SHA"; fi

      - if: steps.head.outputs.go == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.sha }}
          persist-credentials: false

      - if: steps.head.outputs.go == 'true'
        name: Deploy
        env:
          TAG: ${{ needs.publish.outputs.sha }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          OTHER_HOST: ${{ vars.PRODUCTION_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
          APP_URL: ${{ vars.STAGING_APP_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_DEPLOY_KNOWN_HOSTS }}
          OTHER_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: scripts/deploy.sh

  # Manual deploy of an already-published image: production releases, staging re-deploys, and rollbacks.
  manual:
    name: deploy ${{ inputs.environment }} (manual)
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      ((inputs.environment == 'production' && vars.PRODUCTION_DEPLOY_ENABLED == 'true') ||
       (inputs.environment == 'staging' && vars.STAGING_DEPLOY_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars[format('{0}_APP_URL', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check the image exists and the tag still points at that digest
        id: image
        env:
          SHA: ${{ inputs.sha }}
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character lowercase commit SHA"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "digest must look like sha256:<64 hex>"; exit 1; }
          image="ghcr.io/${REPO,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          tagged=$(docker buildx imagetools inspect "$image:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          docker logout ghcr.io
          [ "$tagged" = "$DIGEST" ] || { echo "tag $SHA points at $tagged, not $DIGEST: refusing"; exit 1; }
          echo "ref=$image@$DIGEST" >> "$GITHUB_OUTPUT"

      # The deploy script comes from main (this run), not from the old commit being rolled back to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the chosen environment's key enters this step; the other environment's host key is used just to refuse
      # deploying when both settings point at the same machine.
      - name: Deploy
        env:
          TAG: ${{ inputs.sha }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          DEPLOY_HOST: ${{ vars[format('{0}_DEPLOY_HOST', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          APP_URL: ${{ vars[format('{0}_APP_URL', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          DEPLOY_SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          OTHER_HOST: ${{ vars[format('{0}_DEPLOY_HOST', inputs.environment == 'production' && 'STAGING' || 'PRODUCTION')] }}
          OTHER_KNOWN_HOSTS: ${{ secrets[format('{0}_DEPLOY_KNOWN_HOSTS', inputs.environment == 'production' && 'STAGING' || 'PRODUCTION')] }}
        run: scripts/deploy.sh
